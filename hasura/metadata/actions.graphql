type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepOutput
}

type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
  ): TriggerWorkflowRunOutput
}

type Mutation {
  webhookTrigger(
    workflow_id: uuid!
    secret: String!
  ): WebhookTriggerOutput
}

type TriggerWorkflowRunOutput {
  workflow_run_id: uuid!
  status: String!
  message: String!
}

type ApproveStepOutput {
  step_run_id: uuid!
  workflow_run_id: uuid!
  status: String!
  message: String!
}

type WebhookTriggerOutput {
  workflow_run_id: uuid!
  status: String!
}

