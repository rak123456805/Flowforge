actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: https://flowforge-rose.vercel.app/api/actions/approve-step
      timeout: 300
    permissions:
      - role: user
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: https://flowforge-rose.vercel.app/api/actions/trigger-workflow-run
      timeout: 300
    permissions:
      - role: user
  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: https://amxtepxfuwlmdkhwfjpn.functions.ap-south-1.nhost.run/v0/functions/webhookTrigger
      timeout: 120
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
    - name: WebhookTriggerOutput
  scalars: []
