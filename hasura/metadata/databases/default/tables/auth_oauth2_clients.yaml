table:
  name: oauth2_clients
  schema: auth
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: created_by
array_relationships:
  - name: oauth2_auth_requests
    using:
      foreign_key_constraint_on:
        column: client_id
        table:
          name: oauth2_auth_requests
          schema: auth
  - name: oauth2_refresh_tokens
    using:
      foreign_key_constraint_on:
        column: client_id
        table:
          name: oauth2_refresh_tokens
          schema: auth
