table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id

select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: owner
    permission:
      columns:
        - user_id
        - org_id
        - role
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - user_id
        - org_id
        - role
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: {}
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: {}

delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
