table:
  name: organizations
  schema: public

configuration:
  custom_root_fields:
    select: organizations
    select_by_pk: organization
    select_aggregate: organizations_aggregate
    insert: insert_organizations
    insert_one: insert_organization
    update: update_organizations
    update_by_pk: update_organization
    delete: delete_organizations
    delete_by_pk: delete_organization

computed_fields:
  - name: monthly_usage_percentage
    definition:
      function:
        name: organizations_monthly_usage_percentage
        schema: public
    comment: "Percentage of monthly quota consumed (0-100+)"

array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public

select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - name
        - max_quota_per_month
        - current_month_usage
        - created_at
      computed_fields:
        - monthly_usage_percentage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: editor
    permission:
      columns:
        - id
        - name
        - max_quota_per_month
        - current_month_usage
        - created_at
      computed_fields:
        - monthly_usage_percentage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns:
        - id
        - name
        - max_quota_per_month
        - current_month_usage
        - created_at
      computed_fields:
        - monthly_usage_percentage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - name
        - max_quota_per_month
        - current_month_usage
        - created_at
      computed_fields:
        - monthly_usage_percentage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true

update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - max_quota_per_month
        - current_month_usage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      check: {}
  - role: user
    permission:
      columns:
        - name
        - max_quota_per_month
        - current_month_usage
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
      check: {}
