table:
  name: step_runs
  schema: public
object_relationships:
  - name: step
    using:
      foreign_key_constraint_on: step_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: editor
    permission:
      columns:
        - approved_by
        - approved_at
        - status
      filter:
        _and:
          - workflow_run:
              workflow:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
          - status:
              _eq: paused
      check: {}
  - role: owner
    permission:
      columns:
        - approved_by
        - approved_at
        - status
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      check: {}
  - role: user
    permission:
      columns:
        - approved_by
        - approved_at
        - status
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      check: {}
