table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _nin:
                - db_write
                - notify
      columns:
        - workflow_id
        - step_order
        - type
        - config
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - step_order
        - type
        - config
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - step_order
        - type
        - config
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: editor
    permission:
      columns:
        - step_order
        - config
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _nin:
                - db_write
                - notify
      check: {}
  - role: owner
    permission:
      columns:
        - step_order
        - type
        - config
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: {}
  - role: user
    permission:
      columns:
        - step_order
        - type
        - config
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
