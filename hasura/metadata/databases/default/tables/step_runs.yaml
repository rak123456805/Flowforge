table:
  name: step_runs
  schema: public

object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id

# step_runs are readable by all org roles (scoped via workflow_run → workflow → org).
# Subscriptions on step_runs filtered by workflow_run_id provide live status streaming.
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id

# update_permissions: only used by approveStep action (via admin role).
# But allow owners to update approved_by/approved_at for the approval gate.
update_permissions:
  - role: owner
    permission:
      columns:
        - approved_by
        - approved_at
        - status
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      check: {}
  - role: editor
    permission:
      columns:
        - approved_by
        - approved_at
        - status
      filter:
        _and:
          - workflow_run:
              workflow:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
          - status:
              _eq: paused
      check: {}
