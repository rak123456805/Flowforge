table:
  name: workflow_triggers
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id

insert_permissions:
  - role: owner
    permission:
      columns:
        - workflow_id
        - trigger_type
        - config
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  # Editors can add manual/scheduled triggers but NOT webhook (owner-only, enforced in Action handler)
  - role: editor
    permission:
      columns:
        - workflow_id
        - trigger_type
        - config
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - trigger_type:
              _nin:
                - webhook

update_permissions:
  - role: owner
    permission:
      columns:
        - trigger_type
        - config
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: {}

delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
