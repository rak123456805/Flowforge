table:
  name: workflows
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: owner
    permission:
      columns:
        - org_id
        - name
        - description
        - is_active
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - org_id
        - name
        - description
        - is_active
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - description
        - is_active
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: {}
  - role: editor
    permission:
      columns:
        - name
        - description
        - is_active
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: {}

delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
