services:
  - type: web
    name: flowforge
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_NHOST_SUBDOMAIN
        sync: false
      - key: NEXT_PUBLIC_NHOST_REGION
        sync: false
      - key: NEXT_PUBLIC_NHOST_GRAPHQL_URL
        sync: false
      - key: NHOST_GRAPHQL_URL
        sync: false
      - key: NHOST_ADMIN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WORKFLOW_WEBHOOK_SECRET
        sync: false
      - key: NHOST_FUNCTIONS_URL
        sync: false
    healthCheckPath: /api/health
